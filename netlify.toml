# Netlify configuration (equivalent of vercel.json).
# Netlify serves /about from dist/about.html automatically and dist/404.html for unknown URLs.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The bare domain → www redirect is handled by Netlify once www is set as the primary domain.

# ---- Friendly alternate URLs ----
[[redirects]]
  from = "/index"
  to = "/"
  status = 301
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301
[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301
[[redirects]]
  from = "/blogs"
  to = "/blog"
  status = 301
[[redirects]]
  from = "/blogs/*"
  to = "/blog/:splat"
  status = 301
[[redirects]]
  from = "/countries"
  to = "/study-abroad"
  status = 301
[[redirects]]
  from = "/study-destinations"
  to = "/study-abroad"
  status = 301
[[redirects]]
  from = "/mbbs"
  to = "/mbbs-abroad"
  status = 301
[[redirects]]
  from = "/medical-abroad"
  to = "/mbbs-abroad"
  status = 301
[[redirects]]
  from = "/study-in-united-kingdom"
  to = "/study-in-uk"
  status = 301
[[redirects]]
  from = "/study-in-us"
  to = "/study-in-usa"
  status = 301
[[redirects]]
  from = "/scholarship"
  to = "/scholarships"
  status = 301
[[redirects]]
  from = "/loans"
  to = "/education-loan"
  status = 301
[[redirects]]
  from = "/visa"
  to = "/student-visa"
  status = 301
[[redirects]]
  from = "/exams-and-tests"
  to = "/exams"
  status = 301
[[redirects]]
  from = "/events-and-webinars"
  to = "/events"
  status = 301
[[redirects]]
  from = "/counselling"
  to = "/free-counselling"
  status = 301
[[redirects]]
  from = "/privacy"
  to = "/privacy-policy"
  status = 301
[[redirects]]
  from = "/terms"
  to = "/terms-and-conditions"
  status = 301

# ---- Security headers ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-DNS-Prefetch-Control = "on"

# ---- Caching ----
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hero*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/testimonials/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/logo.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
